<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waqqad Logo Guidelines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Reem+Kufi:wght@600&display=swap">
<style>
/* A4 landscape guideline book: one idea per page, logos drawn from the package files. */
@page { size: 297mm 210mm; margin: 0; }
:root {
  --navy: #0B1F3A; --amber: #F2A93B; --teal: #007C91; --mist: #F3F5F8; --pale: #FFE3A8;
  --ink: #0B1F3A; --muted: #5A6B82; --line: #DCE2EA;
  --ar: "IBM Plex Sans Arabic", "Noto Sans Arabic", sans-serif;
  --en: "IBM Plex Sans", Arial, sans-serif;
  --mono: "IBM Plex Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; color: var(--ink); font: 10.5pt/1.5 var(--en); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { width: 297mm; height: 210mm; padding: 16mm 18mm 14mm; position: relative; overflow: hidden; page-break-after: always; break-after: page; display: flex; flex-direction: column; }
.page:last-child { page-break-after: auto; break-after: auto; }
.page.navy { background: var(--navy); color: #fff; }
.page.mist { background: var(--mist); }
.runhead { display: flex; justify-content: space-between; align-items: baseline; font: 500 8pt var(--mono); color: var(--muted); letter-spacing: .04em; margin-bottom: 10mm; }
.navy .runhead { color: #8EA2BD; }
.runhead b { font: 700 10pt var(--ar); color: inherit; }
h1 { font: 600 30pt/1.1 var(--en); margin: 0; letter-spacing: -.01em; }
h2 { font: 600 22pt/1.15 var(--en); margin: 0 0 3mm; letter-spacing: -.005em; }
h2 .ar { font: 700 20pt var(--ar); color: var(--muted); margin-inline-start: 4mm; }
.navy h2 .ar { color: #8EA2BD; }
.lede { color: var(--muted); max-width: 150mm; margin: 0 0 8mm; font-size: 11pt; }
.navy .lede { color: #B9C6D8; }
.ar-p { font-family: var(--ar); direction: rtl; }
.cols { display: grid; gap: 10mm; flex: 1; min-height: 0; }
.c2 { grid-template-columns: 1fr 1fr; } .c3 { grid-template-columns: 1fr 1fr 1fr; } .c4 { grid-template-columns: repeat(4, 1fr); }
.box { border-radius: 4mm; display: grid; place-items: center; padding: 8mm; position: relative; min-height: 0; }
.box.w { background: #fff; border: .3mm solid var(--line); }
.box.n { background: var(--navy); }
.box.m { background: var(--mist); }
.box svg { width: 100%; height: 100%; display: block; }
.cap { font: 500 8pt var(--mono); color: var(--muted); margin-top: 2.5mm; }
.cap b { font: 600 9pt var(--en); color: var(--ink); display: block; margin-bottom: .5mm; }
.navy .cap { color: #8EA2BD; } .navy .cap b { color: #fff; }
table { border-collapse: collapse; width: 100%; font-size: 9.5pt; }
th, td { text-align: left; padding: 2.4mm 3mm; border-bottom: .3mm solid var(--line); vertical-align: top; }
th { font: 600 7.5pt var(--en); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td.m { font-family: var(--mono); font-size: 8.5pt; white-space: nowrap; }
ul.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 3mm; }
ul.rules li { display: grid; grid-template-columns: 4mm 1fr; gap: 2mm; }
ul.rules li::before { content: ""; width: 2.2mm; height: 2.2mm; margin-top: 1.6mm; background: var(--amber); border-radius: .4mm; transform: rotate(45deg); }

/* cover */
.cover { justify-content: space-between; }
.cover .logo { flex: 1; display: grid; place-items: center; }
.cover .logo svg { height: 105mm; width: 100%; }
.cover .foot { display: flex; justify-content: space-between; align-items: end; }
.cover .foot h1 { font-size: 24pt; }
.cover .foot .ar-p { font-size: 15pt; color: #B9C6D8; margin-top: 1mm; }
.cover .foot .ver { font: 500 9pt var(--mono); color: #8EA2BD; text-align: right; }

/* idea */
.idea { display: grid; grid-template-columns: 1.05fr 1fr; gap: 14mm; flex: 1; align-items: center; }
.idea .txt p { margin: 0 0 4mm; font-size: 11.5pt; max-width: 125mm; }
.idea .txt .ar-p { font-size: 12.5pt; line-height: 1.9; color: var(--muted); }
.idea .art { display: grid; place-items: center; position: relative; height: 140mm; }
.idea .art svg { height: 120mm; width: 100%; }
.tag { position: absolute; font: 500 8.5pt var(--en); color: var(--muted); display: flex; gap: 2mm; align-items: center; }
.tag i { width: 12mm; height: .3mm; background: var(--muted); display: block; }

/* typography */
.spec { border-top: .3mm solid var(--line); padding-top: 4mm; }
.spec .big { font-size: 42pt; line-height: 1.1; margin: 2mm 0 3mm; }
.spec .face { font: 500 8.5pt var(--mono); color: var(--muted); }

/* motion frames */
.frames { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5mm; margin-bottom: 7mm; }
.frames svg { width: 100%; aspect-ratio: 1; height: auto; border-radius: 3mm; display: block; }

/* applications */
.apps { display: grid; grid-template-columns: 1.1fr 1fr; grid-template-rows: 1fr 1fr; gap: 7mm; flex: 1; min-height: 0; }
.card { background: var(--navy); border-radius: 2.5mm; aspect-ratio: 85 / 55; padding: 6mm; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2mm 6mm rgba(11,31,58,.25); }
.card svg { height: 26mm; width: 100%; align-self: center; }
.card .who { direction: rtl; color: #fff; font: 9pt/1.5 var(--ar); }
.card .who b { font-size: 10.5pt; display: block; }
.card.back { background: #fff; border: .3mm solid var(--line); }
.card.back svg { height: 16mm; width: 60%; align-self: flex-end; }
.card.back .who { color: var(--navy); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; align-items: center; }
.letter { background: #fff; border: .3mm solid var(--line); border-radius: 2mm; padding: 8mm 9mm; display: grid; gap: 4mm; align-content: start; box-shadow: 0 1.5mm 5mm rgba(11,31,58,.12); }
.letter .hd { display: flex; justify-content: space-between; align-items: center; direction: rtl; border-bottom: .5mm solid var(--teal); padding-bottom: 4mm; }
.letter .hd svg { height: 15mm; width: 55mm; }
.letter .hd span { font: 8pt/1.5 var(--ar); color: var(--muted); }
.letter .ln { height: 1.6mm; background: #E9EDF2; border-radius: 1mm; }
.web { background: #fff; border: .3mm solid var(--line); border-radius: 2.5mm; overflow: hidden; display: flex; flex-direction: column; }
.web .chrome { background: #E9EDF2; height: 7mm; display: flex; align-items: center; gap: 1.5mm; padding: 0 3mm; }
.web .chrome i { width: 2mm; height: 2mm; border-radius: 50%; background: #C7CFDA; display: block; }
.web .bar { direction: rtl; display: flex; align-items: center; gap: 3mm; padding: 4mm 5mm; border-bottom: .3mm solid #E6EAF0; }
.web .bar svg { height: 10mm; width: 32mm; flex: none; }
.web nav { display: none; }
.web .cta { margin-inline-start: auto; white-space: nowrap; font-size: 7pt; }
.web .cta { font: 600 8pt var(--ar); background: var(--teal); color: #fff; border-radius: 1.5mm; padding: 1.5mm 3.5mm; }
.web .hero { direction: rtl; padding: 6mm; font: 700 15pt var(--ar); }
.web .hero span { display: block; font: 400 9pt var(--ar); color: var(--muted); margin-top: 1mm; }
.icons { display: flex; gap: 6mm; align-items: end; justify-content: center; }
.icons svg { display: block; }
.stampbox { background: #FBFAF6; border: .3mm solid var(--line); border-radius: 2.5mm; display: grid; place-items: center; }
.stampbox .seal { border: .7mm solid #1F3A73; border-radius: 2.5mm; padding: 4mm 6mm; transform: rotate(-5deg); opacity: .85; display: grid; justify-items: center; gap: 1mm; }
.stampbox .seal svg { height: 16mm; width: 52mm; filter: url(#ink); }
.stampbox .seal span { font: 600 8pt var(--ar); color: #1F3A73; }

/* misuse */
.misuse { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6mm 6mm; flex: 1; min-height: 0; }
.mis { display: grid; grid-template-rows: 1fr auto; gap: 2mm; min-height: 0; }
.mis .box { padding: 5mm; border: .3mm solid var(--line); background: #fff; }
.mis .box::after { content: ""; position: absolute; inset-block-start: 2.5mm; inset-inline-end: 2.5mm; width: 5mm; height: 5mm; border-radius: 50%; background: #C4623A url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><path d='M3 3l4 4M7 3L3 7' stroke='white' stroke-width='1.4' stroke-linecap='round'/></svg>") center / 70% no-repeat; }
.mis .cap { margin: 0; font: 500 8.5pt var(--en); color: var(--ink); }

/* files */
pre.tree { font: 9pt/1.7 var(--mono); background: var(--mist); border-radius: 3mm; padding: 6mm 7mm; margin: 0; white-space: pre; }
.back { justify-content: center; align-items: center; }
.back svg { height: 46mm; width: 100%; }
.back .url { position: absolute; bottom: 14mm; left: 0; right: 0; text-align: center; font: 500 9pt var(--mono); color: #8EA2BD; }
</style>
</head>
