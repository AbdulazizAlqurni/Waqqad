<svg xmlns="http://www.w3.org/2000/svg" class="wq wq-ember wq-loop" viewBox="-12 -30 124 130" width="124" height="130" style="--wq-ink:#FFFFFF;--wq-spark:#F2A93B;--wq-lift:14.14px"><style>.wq .wq-t, .wq .wq-s, .wq .wq-g, .wq .wq-c, .wq .wq-k, .wq .wq-h, .wq .wq-r { transform-box: fill-box; transform-origin: 50% 50%; transition: transform .5s cubic-bezier(.2, .9, .25, 1.15), opacity .4s ease; } .wq .wq-k > * { transition: stroke .4s ease; } .wq .wq-r { opacity: 0; } .wq-core .wq-tL { --ox: 6px; --oy: 0px; } .wq-core .wq-tR { --ox: -6px; --oy: 0px; } .wq-core .wq-tT { --ox: 0px; --oy: 6px; } .wq-core .wq-tB { --ox: 0px; --oy: -6px; } .wq-lift:is(:hover, .wq-hover) .wq-s, .wq-burst:is(:hover, .wq-hover) .wq-s, .wq-socket:is(:hover, .wq-hover) .wq-s { transform: translateY(-6px); } .wq-lift:is(:hover, .wq-hover) .wq-t { transform: scale(.93); } .wq-glint:is(:hover, .wq-hover) .wq-g { animation: wq-twinkle .8s ease-out; } .wq-glint:is(:hover, .wq-hover) .wq-s { transform: scale(1.06); } .wq-burst:is(:hover, .wq-hover) .wq-c { transform: translate(calc(var(--dx) * .45), calc(var(--dy) * .45 - 6px)); } .wq-core:is(:hover, .wq-hover) .wq-tL { transform: translateX(-4px); } .wq-core:is(:hover, .wq-hover) .wq-tR { transform: translateX(4px); } .wq-core:is(:hover, .wq-hover) .wq-tT { transform: translateY(-4px); } .wq-core:is(:hover, .wq-hover) .wq-tB { transform: translateY(4px); } .wq-core:is(:hover, .wq-hover) .wq-s { transform: scale(1.6); } .wq-socket:is(:hover, .wq-hover) .wq-k > * { stroke: var(--wq-spark); } .wq-halo:is(:hover, .wq-hover) .wq-h { transform: scale(1.08); } .wq-halo:is(:hover, .wq-hover) .wq-r { animation: wq-ripple .9s ease-out; } .wq-intro .wq-t { animation: wq-pop .55s cubic-bezier(.2, .8, .2, 1) both; } .wq-intro .wq-tB { animation-delay: .08s; } .wq-intro .wq-tR { animation-delay: .16s; } .wq-intro .wq-tT { animation-delay: .24s; } .wq-intro:not(.wq-core) .wq-s { animation: wq-rise 1.1s .25s cubic-bezier(.3, .7, .2, 1) both; } .wq-intro:not(.wq-core) .wq-sf { animation: wq-warm 1.1s .25s both; } .wq-intro .wq-g { animation: wq-glint-in .6s 1.25s both; } .wq-intro .wq-c { animation: wq-fly .7s 1.15s cubic-bezier(.2, .8, .2, 1) both; } .wq-intro .wq-c2 { animation-delay: 1.22s; } .wq-intro .wq-c3 { animation-delay: 1.29s; } .wq-intro.wq-core .wq-t { animation: wq-core-open 1.3s cubic-bezier(.3, .7, .2, 1) both; } .wq-intro.wq-core .wq-s { animation: wq-ignite 1.3s both; } .wq-intro .wq-k > * { stroke-dasharray: 100; animation: wq-draw .9s .7s ease-out both; } .wq-intro .wq-h { animation: wq-halo-in .6s 1.2s cubic-bezier(.2, .8, .2, 1) both; } .wq-loop.wq-lift .wq-s { animation: wq-bob 2.6s ease-in-out infinite; } .wq-loop.wq-glint .wq-g { animation: wq-twinkle-loop 3s ease-in-out infinite; } .wq-loop.wq-burst .wq-c { animation: wq-ember 2.4s ease-out infinite; } .wq-loop.wq-burst .wq-c2 { animation-delay: .25s; } .wq-loop.wq-burst .wq-c3 { animation-delay: .5s; } .wq-loop.wq-core .wq-t { animation: wq-breathe 2.4s ease-in-out infinite; } .wq-loop.wq-core .wq-s { animation: wq-beat 2.4s ease-in-out infinite; } .wq-loop.wq-socket .wq-s { animation: wq-dock 3.4s cubic-bezier(.5, 0, .2, 1) infinite; } .wq-loop.wq-socket .wq-sf { animation: wq-dock-fill 3.4s ease-in-out infinite; } .wq-loop.wq-halo .wq-r { animation: wq-ripple 2.2s ease-out infinite; } @keyframes wq-pop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } } @keyframes wq-rise { 0% { transform: translateY(var(--wq-lift)) scale(0); } 35% { transform: translateY(var(--wq-lift)) scale(1); } 72% { transform: translateY(-3px); } 100% { transform: translateY(0); } } @keyframes wq-warm { 0%, 40% { fill: var(--wq-ink); } 75%, 100% { fill: var(--wq-spark); } } @keyframes wq-glint-in { 0% { transform: scale(0) rotate(-90deg); } 60% { transform: scale(1.4) rotate(0); } 100% { transform: scale(1) rotate(0); } } @keyframes wq-twinkle { 0% { transform: scale(1) rotate(0); } 45% { transform: scale(1.6) rotate(45deg); } 100% { transform: scale(1) rotate(90deg); } } @keyframes wq-twinkle-loop { 0%, 68% { transform: scale(1) rotate(0); } 80% { transform: scale(1.6) rotate(45deg); } 92%, 100% { transform: scale(1) rotate(90deg); } } @keyframes wq-fly { from { transform: translate(calc(var(--dx) * -1), calc(var(--dy) * -1)) scale(0); opacity: 0; } to { transform: none; opacity: 1; } } @keyframes wq-ember { 0% { transform: translate(calc(var(--dx) * -1), calc(var(--dy) * -1)) scale(0); opacity: 0; } 15% { opacity: 1; } 65% { transform: translate(calc(var(--dx) * .25), calc(var(--dy) * .25)) scale(1); opacity: 1; } 100% { transform: translate(calc(var(--dx) * .6), calc(var(--dy) * .6)) scale(.5); opacity: 0; } } @keyframes wq-core-open { 0% { transform: translate(var(--ox), var(--oy)) scale(0); opacity: 0; } 35% { transform: translate(var(--ox), var(--oy)) scale(1); opacity: 1; } 60% { transform: translate(var(--ox), var(--oy)); } 85% { transform: translate(calc(var(--ox) * -.3), calc(var(--oy) * -.3)); } 100% { transform: none; } } @keyframes wq-ignite { 0%, 58% { transform: scale(0) rotate(-45deg); } 82% { transform: scale(1.7) rotate(0); } 100% { transform: scale(1); } } @keyframes wq-breathe { 0%, 100% { transform: none; } 50% { transform: translate(calc(var(--ox) * -.5), calc(var(--oy) * -.5)); } } @keyframes wq-beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.55); } } @keyframes wq-draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } } @keyframes wq-halo-in { from { transform: scale(.55); opacity: 0; } to { transform: scale(1); opacity: 1; } } @keyframes wq-ripple { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.75); opacity: 0; } } @keyframes wq-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } } @keyframes wq-dock { 0%, 12% { transform: translateY(0); } 38%, 56% { transform: translateY(var(--wq-lift)); } 82%, 100% { transform: translateY(0); } } @keyframes wq-dock-fill { 0%, 22% { fill: var(--wq-spark); } 38%, 56% { fill: var(--wq-ink); } 74%, 100% { fill: var(--wq-spark); } } @media (prefers-reduced-motion: reduce) { .wq *, .wq { animation: none !important; transition: none !important; } } .wq-rising:is(:hover, .wq-hover) .wq-c { transform: translateY(-8px); } .wq-rising:is(:hover, .wq-hover) .wq-c2 { transform: translateY(-13px); } .wq-rising:is(:hover, .wq-hover) .wq-c3 { transform: translateY(-19px); } .wq-loop.wq-rising .wq-c { animation: wq-rise-ember 2.6s ease-in infinite; } .wq-loop.wq-rising .wq-c2 { animation-delay: .45s; } .wq-loop.wq-rising .wq-c3 { animation-delay: .9s; } @keyframes wq-rise-ember { 0% { transform: translate(calc(var(--dx) * -.7), calc(var(--dy) * -.7)) scale(.3); opacity: 0; } 20% { opacity: 1; } 65% { transform: none; opacity: 1; } 100% { transform: translateY(-14px) scale(.5); opacity: 0; } }</style><rect x="-12" y="-30" width="124" height="130" fill="#0B1F3A"/><g transform="translate(29.49 50)"><g class="wq-t wq-tL"><rect x="-12.0" y="-12.0" width="24" height="24" rx="2.2" fill="#FFFFFF" transform="rotate(45)"/></g></g><g transform="translate(70.51 50)"><g class="wq-t wq-tR"><rect x="-12.0" y="-12.0" width="24" height="24" rx="2.2" fill="#FFFFFF" transform="rotate(45)"/></g></g><g transform="translate(50 70.51)"><g class="wq-t wq-tB"><rect x="-12.0" y="-12.0" width="24" height="24" rx="2.2" fill="#FFFFFF" transform="rotate(45)"/></g></g><g transform="translate(50 15.35)"><path fill="#F2A93B" d="M-5.5 15.2C-2.52 16.57 2.62 16.32 5.5 15.2C8.38 14.08 10.52 11.53 11.8 8.5C13.08 5.47 13.58 1.25 13.2 -3C12.82 -7.25 10.62 -12.33 9.5 -17C8.38 -21.67 6.5 -31 6.5 -31C6.5 -31 1.28 -25.33 -0.8 -27C-2.88 -28.67 -6 -41 -6 -41C-6 -41 -5.92 -33 -6.5 -29C-7.08 -25 -8.38 -21.17 -9.5 -17C-10.62 -12.83 -12.72 -8 -13.2 -4C-13.68 0 -13.68 3.8 -12.4 7C-11.12 10.2 -8.48 13.83 -5.5 15.2Z"><animate attributeName="d" begin="0s" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines=".35 0 .2 1;.35 0 .